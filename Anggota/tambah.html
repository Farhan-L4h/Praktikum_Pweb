<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPUS-Mini | Tambah Anggota</title>

    <!-- menammbahkan CSS -->
    <link rel="stylesheet" href="../asset/css/style.css" />
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../Buku/list.html">Daftar Buku</a></li>
          <li><a href="../Buku/tambah.html">Tambah Buku</a></li>
          <li><a href="list.html">Daftar Anggota</a></li>
          <li><a href="tambah.html">Tambah Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Tambah Anggota</h2>
        <!-- form -->
        <form>
          <p>
            <label for="nama">Nama</label><br />
            <input type="text" id="nama" name="nama" required />
          </p>
          <p>
            <label for="no_anggota">No. Anggota</label><br />
            <input type="text" id="no_anggota" name="no_anggota" required />
          </p>

          <!-- tambahan email -->
          <p>
            <label for="email">Email</label><br />
            <input type="email" id="email" name="email" />
          </p>
          <p>
            <label for="alamat">Alamat</label><br />
            <input type="text" id="alamat" name="alamat" />
          </p>
          <p>
            <label for="no_hp">No. HP</label><br />
            <input type="text" id="no_hp" name="no_hp" />
          </p>
          <p>
            <!-- TAmbahan status -->
            <label for="status">Status</label><br />
            <select id="status" name="status">
              <option value="aktif">Aktif</option>
              <option value="non-aktif">Non-Aktif</option>
            </select>
          </p>

          <p>
            <!-- confirm -->
            <button type="submit">Simpan</button>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
  </body>
</html>
