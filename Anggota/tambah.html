<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />   
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Anggota</title>

    <!-- menammbahkan CSS -->
    <link rel="stylesheet" href="../asset/css/style.css" />
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>

      <!-- Hamburger -->
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../Buku/list.html">Daftar Buku</a></li>
          <li><a href="../Buku/tambah.html">Tambah Buku</a></li>
          <li><a href="list.html">Daftar Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="form-section">
        <h2>Tambah Anggota</h2>
        <!-- form -->
        <form>
          <p>
            <label for="nama">Nama</label><br />
            <input type="text" id="nama" name="nama" required />
          </p>
          <p>
            <label for="no_anggota">No. Anggota</label><br />
            <input type="text" id="no_anggota" name="no_anggota" required />
          </p>

          <!-- tambahan email -->
          <p>
            <label for="email">Email</label><br />
            <input type="email" id="email" name="email" />
          </p>
          <p>
            <label for="alamat">Alamat</label><br />
            <input type="text" id="alamat" name="alamat" />
          </p>
          <p>
            <label for="no_hp">No. HP</label><br />
            <input type="text" id="no_hp" name="no_hp" />
          </p>
          <p>
            <!-- Tambahan status -->
            <span class="status-label">Status</span><br />
            <span class="radio-option">
              <input type="radio" id="aktif" name="status" value="aktif" checked />
              <label for="aktif">Aktif</label>
            </span>
            <span class="radio-option">
              <input type="radio" id="non-aktif" name="status" value="non-aktif" />
              <label for="non-aktif">Non-Aktif</label>
            </span>
          </p>

          <div class="form-actions">
            <!-- confirm -->
            <button type="submit">Simpan</button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
  </body>
</html>
