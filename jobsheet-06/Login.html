<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resposifitas -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- menammbahkan CSS -->
    <link rel="stylesheet" href="./asset/css/style.css?v=2" />

    <title>SIMPUS-Mini | Login</title>
  </head>
  <body>
    <main class="login-main">
      <section class="login-panel">
        <h1 style="text-align: center; margin-bottom: 2rem;">Login</h1>

        <form action="">
          <p>
            <label for="Username">Username</label>
            <input type="text" name="Username" style="margin-bottom: 1rem;" />
          </p>

          <p>
            <label for="Password">Password</label>
            <input type="password" name="password" style="margin-bottom: 2rem;" />
          </p>
          <div class="Login-action">
            <button type="submit">Login</button>
          </div>
          <p style="text-align: center">
            Belum punya akun? <a href="">Daftar di sini</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
